<main class="detalle">
  <a class="volver" routerLink="/">← Todos los tableros</a>

  @if (cargando()) {
    <p class="nota" aria-busy="true">Cargando el tablero…</p>
  } @else if (tablero(); as tablero) {
    <header class="cabecera">
      <div class="identidad">
        <p class="rotulo">Tablero</p>
        <h1>{{ tablero.titulo }}</h1>
      </div>

      @if (puedeEditar()) {
        <button appButton variant="ghost" (click)="renombrar()">Renombrar</button>
      }
    </header>

    <app-board-canvas [board]="tablero" />
  } @else {
    <div class="no-encontrado" role="alert">
      <p>No se encontró ese tablero.</p>
      <a routerLink="/">Volver a la lista</a>
    </div>
  }
</main>

<ng-template #plantillaRenombrar>
  <app-board-form
    modo="renombrar"
    [tituloInicial]="tablero()?.titulo ?? ''"
    (guardado)="guardarNombre($event)"
    (cancelado)="cerrarRenombrar()"
  />
</ng-template>
